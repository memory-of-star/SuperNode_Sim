<rect x="72" y="632" width="976" height="118" rx="12" fill="#fff6e9" stroke="#d7b486"/>
<text x="96" y="664" font-size="20" fill="#183344" font-weight="700" text-anchor="start">运行证据 → 分析检查 → 按需生成报告</text>
<text x="96" y="695" font-size="16" fill="#183344" font-weight="400" text-anchor="start">输入 / 命令 / 哈希 · 任务与端口 CSV · summary.json · 运行台账</text>
<text x="96" y="724" font-size="16" fill="#183344" font-weight="400" text-anchor="start">分析器检查交付、路径与依赖；对应报告脚本绘图，Agent 解释结果与适用范围</text>
<path d="M72 690H38V139H65" fill="none" stroke="#b27735" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#harness-arrow)"/>
<text x="72" y="782" font-size="15" fill="#93642e" font-weight="400" text-anchor="start">虚线：用户或外部 Agent 根据结果决定下一轮实验</text>
<text x="72" y="818" font-size="14" fill="#567183" font-weight="400" text-anchor="start">skills 提供操作指导；CLI 执行命令；仿真器计算事件；HTML 报告由对应脚本生成。</text>
</g></svg>
