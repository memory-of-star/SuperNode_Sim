<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="852" viewBox="0 0 1120 852" role="img" aria-labelledby="harness-title harness-desc">
<title id="harness-title">AI harness：从自然语言需求到可复现的 SUE 实验</title><desc id="harness-desc">外部 AI Agent 阅读仓库中的四份 SKILL.md 操作指南，将需求转为结构化实验；Python 工具完成校验、任务生成、仿真调用和结果检查，报告由对应脚本生成，后续实验由用户或外部 Agent 决定。</desc>
<defs><marker id="harness-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#54788c"/></marker></defs>
<rect width="1120" height="852" rx="18" fill="#f4f8fb"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#183344">
<text x="38" y="44" font-size="26" fill="#183344" font-weight="700" text-anchor="start">AI harness · 实验编排与分析能力</text>
<text x="38" y="73" font-size="15" fill="#567183" font-weight="400" text-anchor="start">已核对仓库 skills、当前 CLI、任务执行器与报告脚本，并完成逐包冒烟验证</text>
<rect x="72" y="100" width="976" height="78" rx="12" fill="#123447" stroke="none"/>
<text x="96" y="132" font-size="20" fill="white" font-weight="700" text-anchor="start">自然语言需求 → 外部 AI Agent</text>
<text x="96" y="158" font-size="16" fill="#dcecf4" font-weight="400" text-anchor="start">Agent 阅读操作指南，明确目标、配置、对照条件和运行前预测</text>
