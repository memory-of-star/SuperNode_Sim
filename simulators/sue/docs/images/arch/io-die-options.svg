<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430">
<rect width="920" height="430" fill="white"/>
<text x="30" y="26" font-family="Arial" font-size="15" font-weight="bold">IO Die / Main Die Interface: Two Modeling Options</text>
<text x="30" y="58" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1f77b4">Option A (recommended): IO Die as forwarding node</text>
<rect x="40" y="80" width="90" height="46" rx="6" fill="#eee" stroke="#333"/>
<text x="85.0" y="100" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Main Die</text>
<text x="85.0" y="115" font-family="Arial" font-size="9" text-anchor="middle" fill="#555">AXI master</text>
<rect x="160" y="80" width="100" height="46" rx="6" fill="#e8f0fe" stroke="#1f77b4"/>
<text x="210.0" y="100" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">IO Die</text>
<text x="210.0" y="115" font-family="Arial" font-size="9" text-anchor="middle" fill="#555">fwd node</text>
<rect x="290" y="80" width="90" height="46" rx="6" fill="#e8f6ec" stroke="#2ca02c"/>
<text x="335.0" y="100" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Switch</text>
<text x="335.0" y="115" font-family="Arial" font-size="9" text-anchor="middle" fill="#555">SUE fabric</text>
<rect x="420" y="80" width="100" height="46" rx="6" fill="#e8f0fe" stroke="#1f77b4"/>
<text x="470.0" y="100" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">IO Die</text>
<text x="470.0" y="115" font-family="Arial" font-size="9" text-anchor="middle" fill="#555">peer</text>
<rect x="550" y="80" width="90" height="46" rx="6" fill="#eee" stroke="#333"/>
<text x="595.0" y="100" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Main Die</text>
<text x="595.0" y="115" font-family="Arial" font-size="9" text-anchor="middle" fill="#555">AXI slave</text>
<line x1="130" y1="103" x2="160" y2="103" stroke="#ff7f0e" stroke-width="2.5"/>
<text x="145.0" y="97" font-family="Arial" font-size="9" text-anchor="middle" fill="#ff7f0e">D2D</text>
<line x1="260" y1="103" x2="290" y2="103" stroke="#2ca02c" stroke-width="2.5"/>
<text x="275.0" y="97" font-family="Arial" font-size="9" text-anchor="middle" fill="#2ca02c">SUE</text>
<line x1="380" y1="103" x2="420" y2="103" stroke="#2ca02c" stroke-width="2.5"/>
<text x="400.0" y="97" font-family="Arial" font-size="9" text-anchor="middle" fill="#2ca02c">SUE</text>
<line x1="520" y1="103" x2="550" y2="103" stroke="#ff7f0e" stroke-width="2.5"/>
<text x="535.0" y="97" font-family="Arial" font-size="9" text-anchor="middle" fill="#ff7f0e">D2D</text>
<text x="40" y="155" font-family="Arial" font-size="10">Params: D2D_DELAY_NS (UCIe ~100-200ns) | D2D_BW (>= port rate) | D2D_CREDIT (reticle flow ctl)</text>
<text x="40" y="172" font-family="Arial" font-size="10">RTT budget: prop + fwd + D2D_DELAY x2 (each direction) -- feeds LLR window auto (10xRTT) and CBFC BDP</text>
<text x="40" y="189" font-family="Arial" font-size="10.5" fill="#2ca02c">Pros: models IO-Die forwarding cost, buffer, per-VC mapping on D2D; extensible to IO-Die congestion</text>
<text x="30" y="235" font-family="Arial" font-size="12.5" font-weight="bold" fill="#ff7f0e">Option B (quick estimate): device attribute delay</text>
<rect x="120" y="255" width="100" height="46" rx="6" fill="#eee" stroke="#333"/>
<text x="170.0" y="275" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Main Die</text>
<text x="170.0" y="290" font-family="Arial" font-size="9" text-anchor="middle" fill="#555">app logic</text>
<rect x="280" y="255" width="110" height="46" rx="6" fill="#e8f0fe" stroke="#1f77b4"/>
<text x="335.0" y="275" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">SueNetDevice</text>
<text x="335.0" y="290" font-family="Arial" font-size="9" text-anchor="middle" fill="#555">+m_d2dDelayNs</text>
<rect x="460" y="255" width="90" height="46" rx="6" fill="#e8f6ec" stroke="#2ca02c"/>
<text x="505.0" y="275" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Switch</text>
<line x1="220" y1="278" x2="280" y2="278" stroke="#999" stroke-width="2"/>
<line x1="390" y1="278" x2="460" y2="278" stroke="#2ca02c" stroke-width="2.5"/>
<text x="120" y="330" font-family="Arial" font-size="10">TX/RX each adds m_d2dDelayNs; no new node, no D2D buffer/flow-ctl modeling</text>
<text x="120" y="348" font-family="Arial" font-size="10.5" fill="#ff7f0e">Use first to validate RTT budget (prop+fwd+d2d &lt;= 1us), then graduate to Option A if D2D internals matter</text>
<rect x="30" y="375" width="860" height="38" rx="6" fill="#f7f7f7" stroke="#ccc"/>
<text x="460" y="398" font-family="Arial" font-size="11" text-anchor="middle">AXI 4-channel VC semantics preserved across D2D (UCIe lane groups map to VC); pcap point extended to D2D segment</text>
</svg>