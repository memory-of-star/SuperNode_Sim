<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
<rect width="920" height="400" fill="white"/>
<text x="30" y="26" font-family="Arial" font-size="15" font-weight="bold">GoBackN Cascade at Long RTT (§12.52-53): one bad frame, whole-window replays</text>
<line x1="60" y1="330" x2="880" y2="330" stroke="#333" stroke-width="2"/>
<line x1="60" y1="324" x2="60" y2="336" stroke="#333" stroke-width="2"/>
<text x="60" y="352" font-family="Arial" font-size="10" text-anchor="middle">t0</text>
<line x1="280" y1="324" x2="280" y2="336" stroke="#333" stroke-width="2"/>
<text x="280" y="352" font-family="Arial" font-size="10" text-anchor="middle">t0+RTT</text>
<line x1="500" y1="324" x2="500" y2="336" stroke="#333" stroke-width="2"/>
<text x="500" y="352" font-family="Arial" font-size="10" text-anchor="middle">+RTT</text>
<line x1="720" y1="324" x2="720" y2="336" stroke="#333" stroke-width="2"/>
<text x="720" y="352" font-family="Arial" font-size="10" text-anchor="middle">+replay_timer (10xRTT)</text>
<text x="62" y="84" font-family="Arial" font-size="10.5" fill="#1f77b4" font-weight="bold">sender TX</text>
<line x1="60" y1="90" x2="880" y2="90" stroke="#1f77b4" stroke-width="1" stroke-dasharray="2,4" opacity="0.5"/>
<text x="62" y="184" font-family="Arial" font-size="10.5" fill="#d62728" font-weight="bold">wire (corruptor 1/100)</text>
<line x1="60" y1="190" x2="880" y2="190" stroke="#d62728" stroke-width="1" stroke-dasharray="2,4" opacity="0.5"/>
<text x="62" y="264" font-family="Arial" font-size="10.5" fill="#2ca02c" font-weight="bold">receiver / ACK</text>
<line x1="60" y1="270" x2="880" y2="270" stroke="#2ca02c" stroke-width="1" stroke-dasharray="2,4" opacity="0.5"/>
<rect x="70" y="78" width="110" height="34" rx="4" fill="#e8f0fe" stroke="#1f77b4"/>
<text x="125.0" y="94" font-family="Arial" font-size="10" text-anchor="middle">seq X..X+92</text>
<text x="125.0" y="107" font-family="Arial" font-size="8.5" text-anchor="middle" fill="#555">RTT window in flight</text>
<rect x="200" y="78" width="110" height="34" rx="4" fill="#e8f0fe" stroke="#1f77b4"/>
<text x="255.0" y="94" font-family="Arial" font-size="10" text-anchor="middle">NACK(X) arrives</text>
<text x="255.0" y="107" font-family="Arial" font-size="8.5" text-anchor="middle" fill="#555">stop new, REPLAY</text>
<rect x="330" y="78" width="150" height="34" rx="4" fill="#e8f0fe" stroke="#1f77b4"/>
<text x="405.0" y="94" font-family="Arial" font-size="10" text-anchor="middle">replay X..X+92 (2us)</text>
<text x="405.0" y="107" font-family="Arial" font-size="8.5" text-anchor="middle" fill="#555">new frames blocked</text>
<rect x="510" y="78" width="120" height="34" rx="4" fill="#fff6e0" stroke="#ff7f0e"/>
<text x="570.0" y="94" font-family="Arial" font-size="10" text-anchor="middle">seq Y bad again</text>
<text x="570.0" y="107" font-family="Arial" font-size="8.5" text-anchor="middle" fill="#555">NACK ignored (REPLAY)</text>
<rect x="660" y="78" width="180" height="34" rx="4" fill="#e8f0fe" stroke="#1f77b4"/>
<text x="750.0" y="94" font-family="Arial" font-size="10" text-anchor="middle">wait replay_timer</text>
<text x="750.0" y="107" font-family="Arial" font-size="8.5" text-anchor="middle" fill="#555">then replay again...</text>
<circle cx="115" cy="190" r="6" fill="#d62728" opacity="0.9"/>
<circle cx="200" cy="190" r="6" fill="#d62728" opacity="0.35"/>
<circle cx="390" cy="190" r="6" fill="#d62728" opacity="0.35"/>
<circle cx="560" cy="190" r="6" fill="#d62728" opacity="0.9"/>
<rect x="330" y="258" width="110" height="30" rx="4" fill="#e8f6ec" stroke="#2ca02c"/>
<text x="385.0" y="274" font-family="Arial" font-size="10" text-anchor="middle">accept in-order</text>
<rect x="510" y="258" width="130" height="30" rx="4" fill="#fdeaea" stroke="#d62728"/>
<text x="575.0" y="274" font-family="Arial" font-size="10" text-anchor="middle">drop out-of-order</text>
<text x="575.0" y="287" font-family="Arial" font-size="8.5" text-anchor="middle" fill="#555">missing DROP (GoBackN)</text>
<rect x="200" y="360" width="560" height="30" rx="4" fill="#f7f7f7" stroke="#ccc"/>
<text x="480" y="379" font-family="Arial" font-size="10.5" text-anchor="middle">cost per bad frame ~= 1/(1-p*N) replay rounds x replay_timer; p=1%, N=92, timer=50us -> ~600us stall -> 4% efficiency; timer=10xRTT -> 38.4Gbps</text>
</svg>