<circle cx="530.0" cy="110.8" r="3.2" fill="#1f77b4"/>
<text x="538.0" y="102.8" font-family="Arial" font-size="10" fill="#1f77b4">37.5µs</text>
<circle cx="760.0" cy="109.3" r="3.2" fill="#1f77b4"/>
<text x="768.0" y="101.3" font-family="Arial" font-size="10" fill="#1f77b4">37.7µs</text>
<polyline points="70.0,110.8 300.0,118.3 530.0,189.7 760.0,343.1" fill="none" stroke="#d62728" stroke-width="2.5"/>
<circle cx="70.0" cy="110.8" r="3.2" fill="#d62728"/>
<text x="78.0" y="102.8" font-family="Arial" font-size="10" fill="#d62728">37.5µs</text>
<circle cx="300.0" cy="118.3" r="3.2" fill="#d62728"/>
<text x="308.0" y="110.3" font-family="Arial" font-size="10" fill="#d62728">36.5µs</text>
