<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
<rect width="800" height="500" fill="white"/>
<text x="70" y="24" font-family="Arial" font-size="15" font-weight="bold">AXI Transaction Latency vs Link Loss Rate (200Gbps,512B payload,500 txns)</text>
