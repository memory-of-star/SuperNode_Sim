<text x="70" y="426" font-family="Arial" font-size="11" font-weight="bold">legend</text>
<line x1="70" y1="438" x2="104" y2="438" stroke="#1f77b4" stroke-width="2.5"/>
<text x="110" y="442" font-family="Arial" font-size="10.5">LLR=1 (lossless, constant latency)</text>
<line x1="70" y1="456" x2="104" y2="456" stroke="#d62728" stroke-width="2.5"/>
<text x="110" y="460" font-family="Arial" font-size="10.5">LLR=0 (lossy, latency drops as rollback overhead reduces)</text>
