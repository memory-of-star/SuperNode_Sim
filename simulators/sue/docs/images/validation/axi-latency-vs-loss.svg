<text x="62" y="310.2" font-family="Arial" font-size="11" text-anchor="end">11.2µs</text>
<line x1="70" y1="222.5" x2="760" y2="222.5" stroke="#ddd"/>
<text x="62" y="226.5" font-family="Arial" font-size="11" text-anchor="end">22.5µs</text>
