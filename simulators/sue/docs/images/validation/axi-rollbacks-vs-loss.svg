<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
<rect width="800" height="500" fill="white"/>
<text x="70" y="24" font-family="Arial" font-size="15" font-weight="bold">AXI Transaction Rollbacks vs Link Loss Rate (200Gbps,512B payload,500 txns)</text>
<line x1="70" y1="390.0" x2="760" y2="390.0" stroke="#ddd"/>
<text x="62" y="394.0" font-family="Arial" font-size="11" text-anchor="end">0</text>
<line x1="70" y1="306.2" x2="760" y2="306.2" stroke="#ddd"/>
<text x="62" y="310.2" font-family="Arial" font-size="11" text-anchor="end">70</text>
<line x1="70" y1="222.5" x2="760" y2="222.5" stroke="#ddd"/>
<text x="62" y="226.5" font-family="Arial" font-size="11" text-anchor="end">140</text>
<line x1="70" y1="138.8" x2="760" y2="138.8" stroke="#ddd"/>
<text x="62" y="142.8" font-family="Arial" font-size="11" text-anchor="end">210</text>
<line x1="70" y1="55.0" x2="760" y2="55.0" stroke="#ddd"/>
<text x="62" y="59.0" font-family="Arial" font-size="11" text-anchor="end">280</text>
<text x="70.0" y="410" font-family="Arial" font-size="12" text-anchor="middle">0</text>
<text x="300.0" y="410" font-family="Arial" font-size="12" text-anchor="middle">1/10000</text>
<text x="530.0" y="410" font-family="Arial" font-size="12" text-anchor="middle">1/1000</text>
<text x="760.0" y="410" font-family="Arial" font-size="12" text-anchor="middle">1/100</text>
<text x="415.0" y="430" font-family="Arial" font-size="12" text-anchor="middle">injected loss rate (1/N frames corrupted on link)</text>
<rect x="72.0" y="388.0" width="30" height="2" fill="#d62728"/>
<rect x="302.0" y="388.8" width="30" height="1.2" fill="#d62728"/>
<text x="317.0" y="383.8" font-family="Arial" font-size="10" text-anchor="middle" fill="#d62728">1</text>
<rect x="532.0" y="369.7" width="30" height="20.3" fill="#d62728"/>
<text x="547.0" y="364.7" font-family="Arial" font-size="10" text-anchor="middle" fill="#d62728">17</text>
<rect x="762.0" y="89.7" width="30" height="300.3" fill="#d62728"/>
<text x="777.0" y="84.7" font-family="Arial" font-size="10" text-anchor="middle" fill="#d62728">251</text>
<text x="70" y="426" font-family="Arial" font-size="11" font-weight="bold">legend</text>
<rect x="70" y="424" width="14" height="14" fill="#1f77b4"/>
<text x="90" y="438" font-family="Arial" font-size="10.5">LLR=1 (lossless, zero rollback)</text>
<rect x="70" y="442" width="14" height="14" fill="#d62728"/>
<text x="90" y="456" font-family="Arial" font-size="10.5">LLR=0 (lossy link, GoBackN rollback)</text>
</svg>