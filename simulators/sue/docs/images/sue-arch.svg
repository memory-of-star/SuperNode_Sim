<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7d"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="800" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a2430">Scale-Up 仿真平台整体架构</text>
  <text x="500" y="56" text-anchor="middle" font-size="11.5" fill="#5a6b7d">ns-3 · SUE Gen1 Lite:AFH 转发 + LLR 链路重传 + CBFC 信用流控 + VRF 转发域隔离 · 100G/200G/400G · TestSuite 64 例 / scratch 51 例</text>

  <!-- Layer 1: 应用/规模层 -->
  <rect x="40" y="74" width="920" height="98" rx="10" fill="#eef3f8" stroke="#b8c6d4"/>
  <text x="60" y="98" font-size="14" font-weight="700" fill="#1a2430">应用 / 规模层</text>
  <rect x="60" y="108" width="216" height="52" rx="6" fill="#ffffff" stroke="#5a6b7d"/>
  <text x="168" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1a2430">AXI-over-SUE 事务 workload</text>
  <text x="168" y="146" text-anchor="middle" font-size="10.5" fill="#5a6b7d">GoBackN 事务 · AW/AR/B/R→4-VC</text>
  <rect x="292" y="108" width="216" height="52" rx="6" fill="#ffffff" stroke="#5a6b7d"/>
  <text x="400" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1a2430">SueLiteEndpoint 生成器</text>
  <text x="400" y="146" text-anchor="middle" font-size="10.5" fill="#5a6b7d">速率 / 丢包 / VC 可控</text>
  <rect x="524" y="108" width="200" height="52" rx="6" fill="#ffffff" stroke="#5a6b7d"/>
  <text x="624" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1a2430">拓扑生成(SueScaleTopoGen)</text>
  <text x="624" y="146" text-anchor="middle" font-size="10.5" fill="#5a6b7d">8 卡机 · VRF 8 平面 · fat-spine</text>
  <rect x="740" y="108" width="200" height="52" rx="6" fill="#ffffff" stroke="#5a6b7d"/>
  <text x="840" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1a2430">conf 预置 + 入口建网</text>
  <text x="840" y="146" text-anchor="middle" font-size="10.5" fill="#5a6b7d">3 档字节键 · replay_timer auto</text>

  <!-- Layer 2: 数据面(含 XPU/交换机边界) -->
  <rect x="40" y="192" width="920" height="252" rx="10" fill="#f4faf4" stroke="#a9c9a9"/>
  <text x="60" y="216" font-size="14" font-weight="700" fill="#1a2430">数据面(XPU 端点 ↔ SUE 交换机,边界 = SueChannel 逐链路)</text>

  <!-- XPU 侧 -->
  <rect x="62" y="230" width="360" height="196" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="242" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">XPU 端点侧(SueNetDevice)</text>
  <rect x="76" y="262" width="332" height="150" rx="5" fill="#f9fcf9" stroke="#cfe3cf"/>
  <text x="88" y="282" font-size="11" fill="#1a2430">▸ LLR 引擎:GoBackN · NACK-replay · FLUSH 重同步</text>
  <text x="88" y="300" font-size="11" fill="#1a2430">▸ CBFC 引擎:按 cell 向上取整计费 · 逐 VC 窗口</text>
  <text x="88" y="318" font-size="11" fill="#1a2430">▸ 8-VC 出口队列 + 信用门 / LLR 出队门</text>
  <text x="88" y="336" font-size="11" fill="#1a2430">▸ LLDP RTS/RTR 能力协商 · 累积 ACK</text>
  <text x="242" y="380" text-anchor="middle" font-size="10.5" fill="#5a6b7d">真实芯片口径:主 Die(AXI 事务)— D2D — IO Die(SerDes/PHY)</text>
  <text x="242" y="398" text-anchor="middle" font-size="10.5" fill="#5a6b7d">仿真口径:workload → SueNetDevice(上两行为平台内对应物)</text>

  <!-- 边界带 -->
  <rect x="432" y="230" width="136" height="196" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-dasharray="6 3" stroke-width="1.4"/>
  <text x="500" y="252" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2e7d32">SUE 链路边界</text>
  <text x="500" y="268" text-anchor="middle" font-size="10.5" fill="#1a2430">SueChannel 全双工</text>
  <text x="500" y="284" text-anchor="middle" font-size="10.5" fill="#1a2430">100G/200G/400G</text>
  <line x1="448" y1="308" x2="552" y2="308" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrg)"/>
  <text x="500" y="324" text-anchor="middle" font-size="9.8" fill="#1a2430">数据帧(AFH+前导)</text>
  <line x1="552" y1="344" x2="448" y2="344" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="500" y="360" text-anchor="middle" font-size="9.8" fill="#1a2430">CtlOS(ACK/CF/CC)</text>
  <text x="500" y="382" text-anchor="middle" font-size="9.6" fill="#5a6b7d">信用域 / 重传域</text>
  <text x="500" y="396" text-anchor="middle" font-size="9.6" fill="#5a6b7d">= 逐链路(per-hop)</text>

  <!-- 交换机侧 -->
  <rect x="578" y="230" width="360" height="196" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="758" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">SUE 交换机侧(SUESwitchNode)</text>
  <rect x="592" y="262" width="332" height="150" rx="5" fill="#f9fcf9" stroke="#cfe3cf"/>
  <text x="604" y="282" font-size="11" fill="#1a2430">▸ 入口 VRF 派生:DSCP &gt; VLAN &gt; port</text>
  <text x="604" y="300" font-size="11" fill="#1a2430">▸ 查表键 (VRF, DMAC) LPM</text>
  <text x="604" y="318" font-size="11" fill="#1a2430">▸ admit-then-refund:转发 / 丢弃均退款</text>
  <text x="604" y="336" font-size="11" fill="#1a2430">▸ 出口满则挂起不退款 = 信用背压(无损)</text>
  <text x="604" y="354" font-size="11" fill="#1a2430">▸ 转发预算 300ns · shim TTL-- · PFC 共享池对比</text>
  <text x="758" y="380" text-anchor="middle" font-size="10.5" fill="#5a6b7d">VC 派生(DSCP&gt;PCP&gt;default)三处同一张 SueConfig 表</text>

  <!-- Layer 3: 关键机制 -->
  <rect x="40" y="462" width="920" height="130" rx="10" fill="#fdf6f0" stroke="#d9b08c"/>
  <text x="60" y="486" font-size="14" font-weight="700" fill="#1a2430">关键机制(控制面闭环)</text>

  <rect x="60" y="498" width="216" height="78" rx="6" fill="#ffffff" stroke="#c96f2a"/>
  <text x="168" y="518" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c96f2a">LLR</text>
  <text x="168" y="536" text-anchor="middle" font-size="10.5" fill="#1a2430">NACK-replay 完整恢复 · 2^20 回绕</text>
  <text x="168" y="551" text-anchor="middle" font-size="10.5" fill="#1a2430">replay_timer auto(10×RTT)</text>
  <text x="168" y="566" text-anchor="middle" font-size="10.5" fill="#1a2430">data-age 4s(防假 FLUSH)</text>

  <rect x="292" y="498" width="216" height="78" rx="6" fill="#ffffff" stroke="#c96f2a"/>
  <text x="400" y="518" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c96f2a">CBFC</text>
  <text x="400" y="536" text-anchor="middle" font-size="10.5" fill="#1a2430">CF_Update 三触发(2075B 阈值主导)</text>
  <text x="400" y="551" text-anchor="middle" font-size="10.5" fill="#1a2430">CC_Update 周期对账(102µs)</text>
  <text x="400" y="566" text-anchor="middle" font-size="10.5" fill="#1a2430">GoBackN 在途门控 CC_Update</text>

  <rect x="524" y="498" width="200" height="78" rx="6" fill="#ffffff" stroke="#c96f2a"/>
  <text x="624" y="518" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c96f2a">接口契约与对账</text>
  <text x="624" y="536" text-anchor="middle" font-size="10.5" fill="#1a2430">SwitchSend qIndex==派生VC 断言</text>
  <text x="624" y="551" text-anchor="middle" font-size="10.5" fill="#1a2430">credit 四值对账(计费==退款)</text>
  <text x="624" y="566" text-anchor="middle" font-size="10.5" fill="#1a2430">API 契约:api-reference.md</text>

  <rect x="740" y="498" width="200" height="78" rx="6" fill="#ffffff" stroke="#c96f2a"/>
  <text x="840" y="518" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c96f2a">CtlOS 与协商</text>
  <text x="840" y="536" text-anchor="middle" font-size="10.5" fill="#1a2430">400B CtlOS 门 = 2% 带宽帽</text>
  <text x="840" y="551" text-anchor="middle" font-size="10.5" fill="#1a2430">LLDP RTS/RTR/want 握手</text>
  <text x="840" y="566" text-anchor="middle" font-size="10.5" fill="#1a2430">信用窗口死锁约束(阈值≤窗口)</text>

  <!-- Layer 4: 观测与验证体系 -->
  <rect x="40" y="612" width="920" height="128" rx="10" fill="#f3f0fa" stroke="#b7a9d9"/>
  <text x="60" y="636" font-size="14" font-weight="700" fill="#1a2430">观测与验证体系(一键回归)</text>
  <rect x="60" y="648" width="170" height="52" rx="6" fill="#ffffff" stroke="#6a4fae"/>
  <text x="145" y="668" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6a4fae">TestSuite 64 例</text>
  <text x="145" y="686" text-anchor="middle" font-size="10.5" fill="#5a6b7d">含 credit 对账 / 门控回归</text>
  <rect x="246" y="648" width="170" height="52" rx="6" fill="#ffffff" stroke="#6a4fae"/>
  <text x="331" y="668" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6a4fae">scratch 51 判语</text>
  <text x="331" y="686" text-anchor="middle" font-size="10.5" fill="#5a6b7d">含 AUDIT 硬对账断言</text>
  <rect x="432" y="648" width="164" height="52" rx="6" fill="#ffffff" stroke="#6a4fae"/>
  <text x="514" y="668" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6a4fae">UEC 规范矩阵 189 行</text>
  <text x="514" y="686" text-anchor="middle" font-size="10.5" fill="#5a6b7d">128✅ / 30⚠️ / 29❌ / 2N/A</text>
  <rect x="612" y="648" width="164" height="52" rx="6" fill="#ffffff" stroke="#6a4fae"/>
  <text x="694" y="668" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6a4fae">MTP 并行</text>
  <text x="694" y="686" text-anchor="middle" font-size="10.5" fill="#5a6b7d">hash 等价 · 3.33×(prop≥100ns)</text>
  <rect x="792" y="648" width="148" height="52" rx="6" fill="#ffffff" stroke="#6a4fae"/>
  <text x="866" y="668" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6a4fae">THU 实测对齐</text>
  <text x="866" y="686" text-anchor="middle" font-size="10.5" fill="#5a6b7d">CF/ACK/CC 偏差 ≤1.8%</text>
  <rect x="60" y="712" width="880" height="20" rx="4" fill="#ffffff" stroke="#6a4fae" stroke-dasharray="4 2"/>
  <text x="500" y="726" text-anchor="middle" font-size="10.5" fill="#6a4fae">SUE_PCAP 旁路抓包(零侵入,pcap+txt 双输出,字段级解析)+ Wireshark Lua 插件(tshark 9718 帧回归 0 失败)</text>

  <text x="60" y="768" font-size="10.5" fill="#666">建模口径:RTT = 2×prop×2 跳 + fwd 300ns,ScaleUp 目标 ≤1µs · 链路传播预设 100ns(MTP lookahead)</text>
  </svg>
