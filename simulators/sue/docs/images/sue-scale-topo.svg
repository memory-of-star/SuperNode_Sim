    <line x1="800" y1="166" x2="800" y2="268"/>
  </g>
  <text x="500" y="180" text-anchor="middle" font-size="10.5" fill="#8fa3b8">64 台机器 × 双上联(每机 switch → plane0 + plane1;虚线 = 其余 57 台同构,省略)</text>

