  <!-- ================= 实测结果面板 ================= -->
  <rect x="640" y="300" width="330" height="206" rx="10" fill="#fdf6f0" stroke="#d9b08c"/>
  <text x="660" y="324" font-size="13" font-weight="700" fill="#c96f2a">满负载压测实测(E7,400G)</text>
  <text x="660" y="348" font-size="11.5" fill="#1a2430">▸ 流量:全端点跨机环流,连续注入 50µs + 500µs 排空</text>
  <text x="660" y="368" font-size="11.5" fill="#1a2430">▸ 供给 ≈125G/XPU × 512 = 64T &gt; 截面积 51.2T(两平面 128 × 400G)</text>
  <text x="660" y="396" font-size="11.5" fill="#1a2430">▸ clean:31.4T 无损(LLR 全收、无 replay/discard)</text>
  <text x="660" y="416" font-size="11.5" fill="#1a2430">▸ sat:<b>48.0T = 93.7% 截面积</b></text>
  <text x="660" y="436" font-size="11.5" fill="#1a2430">▸ 投递 261,760 / 261,760 帧全收,credit_exhausted = 221,528</text>
  <text x="660" y="456" font-size="11.5" fill="#1a2430">▸ CBFC 背压:交换机持退款、发送端停发——无损饱和</text>
  <text x="660" y="476" font-size="11.5" fill="#5a6b7d">▸ 墙钟:clean/sat 单线程可跑;MTP-8 等价但 7.5× 慢(开放项)</text>
  <text x="660" y="496" font-size="11.5" fill="#5a6b7d">▸ 双平面断言:两 spine 均转发(plane0≈1180 / plane1≈1380 跨机流)</text>
</svg>
