<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a2430">512 口满负载压测拓扑(64 机 × 8 XPU · 2-plane fat spine)</text>
  <text x="500" y="55" text-anchor="middle" font-size="12" fill="#5a6b7d">578 节点 = 512 XPU + 64 机内 switch + 2 spine · 640 链路 = 512 机内 + 128 上联 · 400G 全链路 · ACK spacing 16384B</text>

  <!-- ================= spine 层 ================= -->
  <rect x="160" y="80" width="330" height="86" rx="10" fill="#eef3f8" stroke="#2e7d32" stroke-width="2"/>
  <text x="325" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">fat spine · plane 0(node 576)</text>
  <text x="325" y="122" text-anchor="middle" font-size="11" fill="#1a2430">64 × 400G 上联口(每机 1 条)</text>
  <text x="325" y="138" text-anchor="middle" font-size="11" fill="#5a6b7d">跨机流量平面 0 · ECMP 流哈希分拆(§12.33)</text>
  <text x="325" y="155" text-anchor="middle" font-size="11" fill="#5a6b7d">实测 plane0 ≈ 1180/2560 跨机流</text>

  <rect x="510" y="80" width="330" height="86" rx="10" fill="#eef3f8" stroke="#2e7d32" stroke-width="2"/>
  <text x="675" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">fat spine · plane 1(node 577)</text>
  <text x="675" y="122" text-anchor="middle" font-size="11" fill="#1a2430">64 × 400G 上联口(每机 1 条)</text>
  <text x="675" y="138" text-anchor="middle" font-size="11" fill="#5a6b7d">跨机流量平面 1 · 等代价 ECMP 双平面</text>
  <text x="675" y="155" text-anchor="middle" font-size="11" fill="#5a6b7d">实测 plane1 ≈ 1380/2560 跨机流</text>

  <!-- 跨机路径标注 -->
  <text x="500" y="196" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c96f2a">跨机路径 4 跳:XPU → 机内 switch → spine → 对端机内 switch → XPU(两平面等代价 ECMP)</text>

